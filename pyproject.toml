[project]
name = "flash-context"
version = "0.3.1"
description = "Read-only context exploration and retrieval for AI agents, starting with codebases and repositories."
readme = "README.md"
requires-python = ">=3.13"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "flash-context maintainers" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development",
]
dependencies = [
  "httpx>=0.28.0",
  "PyYAML>=6.0.0",
  "regex>=2026.9.29",
]

[project.urls]
Repository = "https://github.com/zyf0717/flash-context"
Issues = "https://github.com/zyf0717/flash-context/issues"

[project.optional-dependencies]
mcp = ["mcp>=1.13.0,<2"]

[project.scripts]
flash-context = "flash_context.cli:main"

[dependency-groups]
dev = [
  "mypy>=1.15.0",
  "pytest>=8.3.0",
  "ruff>=0.9.0",
  "types-PyYAML>=6.0.12",
  "types-regex>=2026.9.29.20261030",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flash_context"]

[tool.hatch.build.targets.sdist]
include = [
  "/src/flash_context",
  "/pyproject.toml",
  "/README.md",
  "/CHANGELOG.md",
  "/LICENSE",
  "/config.yaml.example",
  "/.env.example",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["tests/fixtures"]
markers = [
  "e2e: endpoint-backed opt-in end-to-end tests",
]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src/flash_context", "tests/unit", "tests/contract", "scripts"]
exclude = ["tests/fixtures"]
