name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.11.21"
          python-version: ${{ matrix.python }}
      - run: uv sync --locked --extra mcp
      - run: uv run --locked ruff check .
      - run: uv run --locked mypy
      - run: uv run --locked pytest -m "not e2e"

  build:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.11.21"
          python-version: "3.13"
      - name: Check tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: test "$RELEASE_TAG" = "v$(uv version --short)"
      - run: uv build
      - run: uvx twine check --strict dist/*
      - name: Check installed wheel and source distribution
        run: |
          version=$(uv version --short)
          uv venv /tmp/wheel-check
          uv pip install --python /tmp/wheel-check/bin/python dist/*.whl
          PATH="/tmp/wheel-check/bin:$PATH" /tmp/wheel-check/bin/python scripts/smoke_test.py "$version"
          uv venv /tmp/sdist-check
          uv pip install --python /tmp/sdist-check/bin/python "dist/flash_context-$version.tar.gz[mcp]"
          PATH="/tmp/sdist-check/bin:$PATH" /tmp/sdist-check/bin/python scripts/smoke_test.py "$version" --mcp
      - uses: actions/upload-artifact@v7.0.2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: distributions
          path: dist/*
          if-no-files-found: error
